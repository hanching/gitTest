<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級管理系統</title>
    <!-- 引入外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>班級管理系統載入中...</h1>
    <!-- 右上角導航列 -->
<nav>
    <div><strong>班級管理系統</strong></div>
    <div class="nav-buttons">
        <button onclick="showPage('schedule')">課表</button>
        <button onclick="showPage('seating')">座位表</button>
        <button onclick="showPage('lottery')">抽籤</button>
    </div>
</nav>

<!-- 頁面容器 (預設顯示課表 active-page) -->
<div id="schedule" class="page active-page"><h2>週課表 (上課45分鐘 / 下課15分鐘)</h2>
<p style="font-size: 14px; color: #666; margin-top: 5px;">點擊課程可觀看教室位置與路線說明</p>
<table>
    <thead>
        <tr>
            <th>時間</th>
            <th>節次</th>
            <th>週一</th>
            <th>週二</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="time-col">08:15 - 09:00</td>
            <td>第一節</td>
            <td class="course-cell" onclick="showLocation('國文', '101 教室', '從班級門口直走，右轉第一間。')">國文</td>
            <td class="course-cell" onclick="showLocation('數學', '101 教室', '從班級門口直走，右轉第一間。')">數學</td>
        </tr>
    </tbody>
</table>
</div>
<div id="seating" class="page"><h2>座位表區塊</h2></div>
<div id="lottery" class="page"><h2>數字抽籤系統</h2>
<div class="card">
    <div class="mode-select">
        <label><input type="radio" name="drawMode" value="multi" checked onclick="switchDrawMode()"> 模式 A：指定抽籤人數</label>
        <label><input type="radio" name="drawMode" value="single" onclick="switchDrawMode()"> 模式 B：指定座號收一個</label>
    </div>

    <!-- 模式 A：抽取指定人數 -->
    <div id="panel-multi" class="draw-panel active">
        <div class="input-group">
            座號範圍：<input type="number" id="multiMin" value="1"> 到 <input type="number" id="multiMax" value="40"> 號
        </div>
        <div class="input-group">
            抽取人數：<input type="number" id="multiCount" value="3"> 人
        </div>
        <button class="btn-draw" onclick="drawMulti()">開始抽籤</button>
        <div id="resultMulti" class="result-box">?</div>
    </div>

    <!-- 模式 B：指定座號收一個 -->
    <div id="panel-single" class="draw-panel">
        <p style="font-size: 14px; color: #666; margin-bottom: 10px;">請輸入多個候選座號（用逗點隔開）：</p>
        <div class="input-group">
            <input type="text" id="singleCandidates" placeholder="例如: 3, 7, 15, 22" style="width: 80%;">
        </div>
        <button class="btn-draw" onclick="drawSingle()">隨機抽出一個</button>
        <div id="resultSingle" class="result-box">?</div>
    </div>
</div>
</div>
 
<!-- 教室位置彈出視窗 -->
<div id="locationModal" class="modal">
    <div class="modal-content">
        <h3 id="modalCourse">課程名稱</h3>
        <p><strong>上課地點：</strong><span id="modalRoom"></span></p>
        <div class="route-info">
            <strong>🚶 路線走法：</strong>
            <p id="modalRoute" style="margin-top: 5px;"></p>
        </div>
        <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>
</div>

    <!-- 引入外部 JavaScript 腳本檔 -->
    <script src="main.js"></script>
</body>
</html>
